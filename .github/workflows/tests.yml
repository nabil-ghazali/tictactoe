name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Sous-ensemble suffisant pour importer Back/ et Model/ et lancer les tests
        # (aucune cle API, aucun appel reseau).
        run: pip install pytest fastapi httpx python-dotenv pydantic
      - name: Run tests
        run: pytest -q
